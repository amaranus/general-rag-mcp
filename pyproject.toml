[project]
name = "general-rag-mcp"
version = "0.1.0"
description = "Local general-purpose file RAG MCP server"
requires-python = ">=3.11,<3.15"
dependencies = [
  "mcp[cli]>=1.28,<2",
  "sentence-transformers",
  "numpy",
  "pymupdf",
  "python-docx",
  "openpyxl",
  "python-pptx",
  "beautifulsoup4",
  "striprtf",
  "pillow",
  "pytesseract",
  "torch==2.14.1+cu130",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
[tool.uv]
package = false
